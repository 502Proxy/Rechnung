name: Stage – Development

# Every merge into develop produces a development build for internal testing.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-development
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-macos.yml
    with:
      configuration: Debug
      environment: development
      artifact-name: Gage-dev-${{ github.run_number }}
      retention-days: 7
    secrets: inherit
