name: Stage – Production release

# A version tag (v1.2.3) on main produces the signed and notarized release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: stage-production
  cancel-in-progress: false

jobs:
  verify:
    name: Tag is on main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Releases dürfen nur von Commits auf main erstellt werden."; exit 1; }

  build:
    needs: verify
    uses: ./.github/workflows/build-macos.yml
    with:
      configuration: Release
      environment: production
      artifact-name: Gage-${{ github.ref_name }}
      retention-days: 90
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Gage-${{ github.ref_name }}
          path: dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          draft: ${{ needs.build.outputs.signed != 'true' }}
