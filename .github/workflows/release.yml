name: Stage – Production release

# A version tag (v1.2.3) on main produces the signed and notarized release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: stage-production
  cancel-in-progress: false

jobs:
  verify:
    name: Tag is on main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Releases dürfen nur von Commits auf main erstellt werden."; exit 1; }

  build:
    needs: verify
    uses: ./.github/workflows/build-macos.yml
    with:
      configuration: Release
      environment: production
      artifact-name: Gage-${{ github.ref_name }}
      retention-days: 90
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: Gage-${{ github.ref_name }}
          path: dist
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*
          generate_release_notes: true
          draft: ${{ needs.build.outputs.signed != 'true' }}
