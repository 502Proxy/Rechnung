name: Stage – Production release

# A version tag (v1.2.3) on main produces the signed and notarized release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: stage-production
  cancel-in-progress: false

jobs:
  verify:
    name: Tag is on main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Releases dürfen nur von Commits auf main erstellt werden."; exit 1; }

  build:
    needs: verify
    uses: ./.github/workflows/build-macos.yml
    with:
      configuration: Release
      environment: production
      artifact-name: Gage-${{ github.ref_name }}
      retention-days: 90
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: Gage-${{ github.ref_name }}
          path: dist
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*
          generate_release_notes: true
          draft: ${{ needs.build.outputs.signed != 'true' }}
