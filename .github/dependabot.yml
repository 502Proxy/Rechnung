version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: /Packages/GageKit
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
