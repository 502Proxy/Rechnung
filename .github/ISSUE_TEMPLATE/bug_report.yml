name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Bitte keine echten Kundendaten, IBANs oder API-Schlüssel eintragen.
        Sicherheitslücken bitte vertraulich melden (siehe SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Was hast du erwartet?
  - type: input
    id: version
    attributes:
      label: Gage-Version und macOS-Version
      placeholder: "Gage 0.1.0 (12), macOS 15.1"
