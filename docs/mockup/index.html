<title>Gage Rechnungsapp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: macOS-Fenster (Titelleiste · Seitenleiste · Toolbar · Inhalt), auf dem Handy einspaltig mit horizontaler Navigation */
:root{
  --desk:#dfe4e3; --win:#f7f8f8; --side:#eceff0; --surface:#ffffff; --line:#dde2e2; --line-strong:#c9d0d0;
  --fg:#17201f; --muted:#5d6968; --faint:#8a9594;
  --accent:#0d6b66; --accent-soft:#e1efed; --accent-fg:#ffffff;
  --ok:#1f7a3f; --ok-soft:#e3f2e7; --info:#2357a6; --info-soft:#e5ecf8; --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe5e3;
  --neutral-soft:#eef0f0; --expense:#c48a52;
  --paper:#ffffff; --paper-ink:#1b1f1f; --paper-muted:#666e6e; --paper-line:#e2e5e5;
  --shadow:0 24px 60px rgba(20,40,38,.18),0 2px 8px rgba(20,40,38,.08);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#101414; --win:#1b2020; --side:#202626; --surface:#242b2b; --line:#313a3a; --line-strong:#3f4a4a;
  --fg:#e7eeed; --muted:#a2aeac; --faint:#76817f;
  --accent:#4fb8ae; --accent-soft:#1d3634; --accent-fg:#0b1c1b;
  --ok:#6fcf8e; --ok-soft:#1c3324; --info:#8fb0ee; --info-soft:#1e2a40; --warn:#e8b25c; --warn-soft:#3a2c14; --bad:#f08a80; --bad-soft:#3e1f1c;
  --neutral-soft:#2c3434; --expense:#d6a272; --shadow:0 24px 60px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#101414; --win:#1b2020; --side:#202626; --surface:#242b2b; --line:#313a3a; --line-strong:#3f4a4a;
  --fg:#e7eeed; --muted:#a2aeac; --faint:#76817f;
  --accent:#4fb8ae; --accent-soft:#1d3634; --accent-fg:#0b1c1b;
  --ok:#6fcf8e; --ok-soft:#1c3324; --info:#8fb0ee; --info-soft:#1e2a40; --warn:#e8b25c; --warn-soft:#3a2c14; --bad:#f08a80; --bad-soft:#3e1f1c;
  --neutral-soft:#2c3434; --expense:#d6a272; --shadow:0 24px 60px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
svg[aria-hidden]{width:16px;height:16px;flex:none;vertical-align:-3px}
.toast[hidden]{display:none}
body{background:var(--desk);color:var(--fg);font-family:var(--f-ui);font-size:13.5px;line-height:1.45;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-num);font-size:.92em}

.window{max-width:1320px;margin:0 auto;height:min(880px,calc(100vh - 48px));min-height:640px;display:grid;grid-template-rows:42px 1fr;
  background:var(--win);border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.titlebar{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--side);border-bottom:1px solid var(--line);position:relative}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.titlebar .t{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.chip-mock{margin-left:auto;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-strong);border-radius:99px;padding:2px 8px}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:0}
.sidebar{background:var(--side);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.sidebar .sec{font-size:11px;font-weight:600;color:var(--faint);padding:14px 10px 4px;letter-spacing:.03em}
.nav{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:6px 10px;border-radius:7px;cursor:pointer;text-align:left;color:var(--fg)}
.nav svg{width:16px;height:16px;flex:none;color:var(--accent)}
.nav:hover{background:var(--neutral-soft)}
.nav.active{background:var(--accent);color:var(--accent-fg)}.nav.active svg{color:var(--accent-fg)}
.nav .badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;min-width:18px;text-align:center}
.nav.active .badge{background:var(--accent-fg);color:var(--accent)}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:11.5px;color:var(--muted);display:grid;gap:6px}
.side-foot .row{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}

.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--win);flex-wrap:wrap}
.toolbar h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.toolbar .sub{color:var(--muted);font-size:12.5px}
.toolbar .spacer{flex:1}
.content{overflow:auto;padding:22px;min-width:0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:5px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn svg{width:14px;height:14px}
.kbd{font-size:11px;opacity:.75;margin-left:2px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-paid{background:var(--ok-soft);color:var(--ok)}.p-sent{background:var(--info-soft);color:var(--info)}
.p-draft{background:var(--neutral-soft);color:var(--muted)}.p-over{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--warn-soft);color:var(--warn)}.p-acc{background:var(--accent-soft);color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:13.5px;margin:0;font-weight:600}
.panel-b{padding:14px 16px}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:12px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:4px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .h{font-size:11.5px;color:var(--faint)}
.kpi .v.bad{color:var(--bad)}
.meter{height:8px;border-radius:99px;background:var(--neutral-soft);overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* Listen */
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-circle{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.icon-circle svg{width:16px;height:16px}

table{width:100%;border-collapse:collapse}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--neutral-soft)}
tbody tr.sel td{background:var(--accent-soft)}
.tbl-wrap{overflow-x:auto}

.seg{display:inline-flex;background:var(--neutral-soft);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 11px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Rechnungen split */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.paper-stage{background:var(--neutral-soft);padding:18px;border-radius:0 0 10px 10px;overflow-x:auto}

/* Papier (Rechnungsvorschau) */
.paper{background:var(--paper);color:var(--paper-ink);width:100%;max-width:560px;min-width:420px;margin:0 auto;aspect-ratio:1/1.414;padding:36px 38px;
  box-shadow:0 6px 24px rgba(0,0,0,.14);font-family:"Inter",var(--f-ui);font-size:9.5px;line-height:1.5;display:flex;flex-direction:column}
.paper .from-line{font-size:7.5px;color:var(--paper-muted);border-bottom:1px solid var(--paper-line);padding-bottom:2px;margin-bottom:6px;display:inline-block}
.paper .head{display:flex;justify-content:space-between;gap:20px;margin-bottom:26px}
.paper .brand{font-weight:700;font-size:13px;letter-spacing:-.01em}
.paper .brand small{display:block;font-weight:400;font-size:8.5px;color:var(--paper-muted)}
.paper .meta{display:grid;grid-template-columns:auto auto;gap:1px 12px;font-size:8.5px;align-self:end}
.paper .meta span:nth-child(odd){color:var(--paper-muted)}
.paper h3{font-size:15px;margin:0 0 4px;letter-spacing:-.01em}
.paper .intro{margin:0 0 12px;color:var(--paper-muted)}
.paper table th{background:transparent;color:var(--paper-muted);font-size:8px;border-bottom:1px solid var(--paper-ink);padding:5px 4px;position:static}
.paper table td{border-bottom:1px solid var(--paper-line);padding:6px 4px;font-size:9px}
.paper .tot{margin-left:auto;margin-top:10px;width:55%;display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.paper .tot .g{font-weight:700;font-size:11px;border-top:1px solid var(--paper-ink);padding-top:4px}
.paper .ku{margin-top:14px;padding:7px 9px;background:#f2f4f4;border-radius:3px;font-size:8.5px}
.paper .foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--paper-line);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:7.5px;color:var(--paper-muted)}

/* Editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.form{display:grid;gap:14px}
.field{display:grid;gap:4px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:6px 9px;min-width:0}
textarea.input{resize:vertical;min-height:60px}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.items td{padding:5px 4px;border:0}
.items th{position:static;padding:4px}
.items .input{padding:5px 7px}
.icon-btn{border:0;background:none;color:var(--faint);cursor:pointer;padding:4px;border-radius:5px;display:grid;place-items:center}
.icon-btn:hover{background:var(--bad-soft);color:var(--bad)}
.icon-btn svg{width:14px;height:14px}
.hint{display:flex;gap:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--fg);font-size:12.5px}
.hint svg{width:16px;height:16px;color:var(--accent);flex:none;margin-top:1px}
.hint.warn{background:var(--warn-soft)}.hint.warn svg{color:var(--warn)}
.sticky{position:sticky;top:0}

/* Kalender */
.gig{display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.gig:first-child{border-top:0}
.date-tile{width:52px;flex:none;border-radius:9px;border:1px solid var(--line);overflow:hidden;text-align:center;background:var(--surface)}
.date-tile b{display:block;background:var(--bad);color:#fff;font-size:10px;letter-spacing:.06em;padding:1px 0;text-transform:uppercase}
.date-tile span{display:block;font-size:20px;font-weight:650;padding:2px 0 3px}
.gig .grow{flex:1;min-width:200px}
.gig.past{opacity:.85}
.switch{position:relative;width:34px;height:20px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:var(--line-strong);border-radius:99px;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(14px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.flow div{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface)}
.flow b{display:block;font-size:12.5px;margin-bottom:2px}
.flow small{color:var(--muted);font-size:11.5px}
.flow em{font-style:normal;font-family:var(--f-num);font-size:11px;color:var(--accent);display:block;margin-bottom:4px}

/* Bank */
.bank-card{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:16px}
.bunq-logo{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#2a9d8f,#3a86ff 35%,#f4a261 70%,#e63946);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.amt-in{color:var(--ok);font-weight:600}
.amt-out{color:var(--fg)}
select.mini{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:2px 6px;font-size:12.5px;max-width:100%}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* EÜR */
.euer-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.euer-row:last-child{border-bottom:0}
.euer-row.total{font-weight:700;font-size:15px;border-top:2px solid var(--fg);border-bottom:0;padding-top:10px;margin-top:4px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--f-ui)}
svg.chart .grid-l{stroke:var(--line);stroke-width:1}

/* Settings */
.set-sec{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding:20px 0;border-top:1px solid var(--line)}
.set-sec:first-child{border-top:0;padding-top:0}
.set-sec h2{font-size:14px;margin:0 0 4px}
.radio-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-card input{margin-top:3px;accent-color:var(--accent)}
.status-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Modal & Toast */
.overlay{position:fixed;inset:0;background:rgba(10,20,20,.38);display:grid;place-items:center;padding:20px;z-index:50;backdrop-filter:blur(2px)}
.modal{background:var(--win);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h2{margin:0;font-size:15px}
.modal-b{padding:16px 18px;display:grid;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.mail-field{display:grid;grid-template-columns:70px minmax(0,1fr);align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px}
.mail-field span{color:var(--muted);font-size:12.5px}
.mail-field input{border:0;background:none;padding:2px 0;min-width:0}
.mail-field input:focus{outline:none}
.attach{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);font-size:12.5px;width:max-content;max-width:100%}
.attach b{color:var(--bad);font-size:10px;border:1px solid currentColor;border-radius:3px;padding:0 3px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--win);padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);font-size:13px;z-index:60;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast svg{width:16px;height:16px;flex:none}

.empty{padding:28px 16px;text-align:center;color:var(--muted)}

@media (max-width:1180px){
  .editor,.split{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .cols-main,.cols-2{grid-template-columns:minmax(0,1fr)}
  .set-sec{grid-template-columns:minmax(0,1fr);gap:10px}
}
@media (max-width:760px){
  body{padding-block:0}
  .window{height:auto;min-height:0;border-radius:0;border-left:0;border-right:0;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}
  .titlebar .t{position:static;transform:none}
  .lights{display:none}
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;gap:4px}
  .sidebar .sec,.side-foot{display:none}
  .nav{width:auto;white-space:nowrap}
  .content{overflow:visible;padding:16px}
  .toolbar{padding:12px 16px}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:minmax(0,1fr)}
  .paper{min-width:360px;padding:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="window" role="application" aria-label="Gage Rechnungsapp">
  <div class="titlebar">
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="t">Gage</div>
    <span class="chip-mock">Interaktives Mockup</span>
  </div>
  <div class="app">
    <nav class="sidebar" id="sidebar" aria-label="Navigation"></nav>
    <div class="main">
      <header class="toolbar" id="toolbar"></header>
      <main class="content" id="content"></main>
    </div>
  </div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const TODAY = d("2026-11-17");
function d(s){const [y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd)}
function iso(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}
function addDays(s,n){const x=d(s);x.setDate(x.getDate()+n);return iso(x)}

function total(i){return i.items.reduce((s,it)=>s+(+it.qty||0)*(+it.price||0),0)}
function due(i){return addDays(i.date,+i.dueDays||14)}
function status(i){
  if(i.paidDate) return "paid";
  if(i.status==="draft") return "draft";
  if(d(due(i))<TODAY) return "over";
  return "sent";
}
const ST = {paid:["Bezahlt","p-paid"],sent:["Gesendet","p-sent"],draft:["Entwurf","p-draft"],over:["Überfällig","p-over"]};
const pill = s => `<span class="pill ${ST[s][1]}">${ST[s][0]}</span>`;
function nextNum(){const max=Math.max(...invoices.map(i=>+i.num.split("-")[1]));return "2026-"+String(max+1).padStart(3,"0")}
const year = s => s.slice(0,4)==="2026";
function euer(){
  const inc = tx.filter(t=>t.amount>0 && t.match && year(t.date));
  const exp = tx.filter(t=>t.amount<0 && t.cat && t.cat!=="Privat" && year(t.date));
  const income = inc.reduce((s,t)=>s+t.amount,0);
  const byCat = {}; CATS.forEach(c=>byCat[c]=0);
  exp.forEach(t=>byCat[t.cat]+=-t.amount);
  const expenses = Object.values(byCat).reduce((a,b)=>a+b,0);
  const months = Array.from({length:12},(_,m)=>({i:0,e:0}));
  inc.forEach(t=>months[d(t.date).getMonth()].i+=t.amount);
  exp.forEach(t=>months[d(t.date).getMonth()].e+=-t.amount);
  return {income,expenses,profit:income-expenses,byCat,months};
}
const openTx = () => tx.filter(t=>(t.amount>0&&!t.match)||(t.amount<0&&t.cat===null));

function detailActions(i){
  const s = status(i), a=[];
  if(s==="draft"){a.push(`<button class="btn primary" data-act="send" data-id="${i.id}">${ic("send")}Senden</button>`,`<button class="btn" data-act="edit" data-id="${i.id}">${ic("edit")}Bearbeiten</button>`)}
  if(s==="over") a.push(`<button class="btn primary" data-act="remind" data-id="${i.id}">${ic("bell")}Zahlungserinnerung</button>`);
  if(s==="sent"||s==="over") a.push(`<button class="btn" data-act="markpaid" data-id="${i.id}">${ic("check")}Als bezahlt markieren</button>`);
  a.push(`<button class="btn" data-act="finder" data-id="${i.id}">${ic("folder")}Im Finder zeigen</button>`);
  const info = s==="paid"?`Bezahlt am ${fmtD(i.paidDate)} · per bunq abgeglichen`:s==="draft"?(i.auto?"Automatisch aus Kalender erstellt":"Noch nicht versendet"):`Gesendet am ${fmtD(i.sentDate)} · fällig ${fmtD(due(i))}`;

}

function commitDraft(){
  const D = S.draft;
  if(!D.items.some(it=>it.desc.trim() && +it.price>0)){toast("Füge mindestens eine Leistung mit Preis hinzu.","alert");return null}
  if(D.id){const k=invoices.findIndex(i=>i.id===D.id);invoices[k]=Object.assign({},D,{items:D.items.map(x=>({...x}))});return invoices[k]}
  const n = Object.assign({},D,{id:"i"+(++seq),items:D.items.map(x=>({...x})),status:"draft",sentDate:null,paidDate:null});
  invoices.push(n); if(n.gigId){const g=gigs.find(g=>g.id===n.gigId); if(g) g.invoiceId=n.id}
  return n;
}

function chart(months){
  const W=640,H=230,L=48,R=8,T=12,B=26, iw=W-L-R, ih=H-T-B;
  const max = Math.max(...months.map(m=>Math.max(m.i,m.e)));
  const step = 500, top = Math.ceil(max/step)*step || step;
  const y = v => T+ih-(v/top)*ih;
  const gw = iw/12, bw = Math.min(16,gw*0.32);
  const names=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  let g="";
  for(let v=0;v<=top;v+=step){ if(top/step>6 && (v/step)%2) continue; g+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v.toLocaleString("de-DE")} €</text>`}
  months.forEach((m,k)=>{
    const cx = L+gw*k+gw/2, future = k>10;
    g+=`<rect x="${cx-bw-1}" y="${y(m.i)}" width="${bw}" height="${T+ih-y(m.i)}" rx="2" fill="var(--accent)"><title>${names[k]}: Einnahmen ${eur(m.i)}</title></rect>`;
    g+=`<rect x="${cx+1}" y="${y(m.e)}" width="${bw}" height="${T+ih-y(m.e)}" rx="2" fill="var(--expense)"><title>${names[k]}: Ausgaben ${eur(m.e)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" ${future?'opacity=".5"':""}>${names[k]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Einnahmen und Ausgaben je Monat 2026">${g}</svg>`;
}

  const radio=(name,val,title,desc)=>`<label class="radio-card"><input type="radio" name="${name}" value="${val}" ${s[name]===val?"checked":""} data-set="${name}"><span><b>${title}</b><br><span class="small muted">${desc}</span></span></label>`;
  $("content").innerHTML = `<div class="panel panel-b" style="padding:22px">
    <div class="set-sec"><div><h2>Deine Angaben</h2><div class="small muted">Erscheinen auf jeder Rechnung (Pflichtangaben nach § 14 UStG).</div></div>
      <div class="row-f"><div class="field"><label for="s-n">Name</label><input class="input" id="s-n" value="${esc(ME.name)}"></div>
      <div class="field"><label for="s-b">Tätigkeit</label><input class="input" id="s-b" value="${esc(ME.biz)}"></div>
      <div class="field"><label for="s-a">Anschrift</label><input class="input" id="s-a" value="${esc(ME.street)}, ${esc(ME.city)}"></div>
      <div class="field"><label for="s-t">Steuernummer</label><input class="input mono" id="s-t" value="${esc(ME.tax)}"></div></div></div>
    <div class="set-sec"><div><h2>Rechnungen</h2><div class="small muted">Nummernkreis und Ablage</div></div>
      <div class="row-f"><div class="field"><label for="s-nr">Nummernformat</label><input class="input mono" id="s-nr" value="JJJJ-NNN"></div>
      <div class="field"><label for="s-z">Zahlungsziel</label><select class="input" id="s-z"><option>7 Tage</option><option selected>14 Tage</option><option>30 Tage</option></select></div>
      <div class="field" style="grid-column:1/-1"><label for="s-p">Speicherort</label><div style="display:flex;gap:8px"><input class="input mono" id="s-p" value="~/Dokumente/Gage/Rechnungen/2026/" readonly><button class="btn" data-act="noop">Ändern …</button></div><span class="small muted">PDFs werden nach dem Speichern automatisch abgelegt, auch per iCloud Drive oder Time Machine gesichert.</span></div></div></div>
    <div class="set-sec"><div><h2>E-Mail-Versand</h2><div class="small muted">Wie Rechnungen verschickt werden</div></div>
      <div class="grid" style="gap:8px">${radio("sendMode","mail","Über Apple Mail","Nutzt dein bestehendes Postfach. Gesendete Rechnungen liegen auch in „Gesendet“.")}
        ${radio("sendMode","smtp","Direkt per SMTP","Versand im Hintergrund, ohne dass Mail geöffnet wird.")}</div></div>
    <div class="set-sec"><div><h2>Apple Kalender</h2><div class="small muted">Rechnungen aus Gig-Terminen</div></div>
      <div class="grid" style="gap:12px"><div class="row-f"><div class="field"><label for="s-cal">Kalender</label><select class="input" id="s-cal" data-set="calendar">${["Gigs","Arbeit","Privat"].map(c=>`<option${c===s.calendar?" selected":""}>${c}</option>`).join("")}</select></div>
        <div class="field"><label for="s-time">Rechnung erstellen am Folgetag um</label><input class="input" type="time" id="s-time" data-set="time" value="${s.time}"></div></div>
        ${radio("autoMode","review","Erstellen und zur Prüfung vorlegen","Empfohlen. Du bekommst eine Mitteilung und sendest mit einem Klick.")}
        ${radio("autoMode","auto","Erstellen und automatisch senden","Nur für Stammkunden mit festen Gagen sinnvoll.")}</div></div>
    <div class="set-sec"><div><h2>bunq</h2><div class="small muted">Zahlungseingänge und Ausgaben</div></div>
      <div class="grid" style="gap:10px"><div class="status-line"><span class="dot"></span><b>Verbunden</b><span class="small muted">· Geschäftskonto ${ME.iban.slice(-4)} · Nur-Lese-Zugriff über API-Schlüssel</span></div>
        <div class="small muted">Der API-Schlüssel liegt verschlüsselt im macOS-Schlüsselbund. Gage kann keine Überweisungen ausführen.</div>
        <div><button class="btn" data-act="noop">Verbindung trennen</button></div></div></div>
  </div>`;
}

const VIEWS = {overview:vOverview,invoices:vInvoices,editor:vEditor,customers:vCustomers,calendar:vCalendar,bank:vBank,euer:vEuer,settings:vSettings};

/* ---------- Modal & Toast ---------- */
function openSend(i,reminder){
  const c = cust(i.customerId);
  const subj = reminder?`Zahlungserinnerung Rechnung ${i.num}`:`Rechnung ${i.num} – ${i.items[0].desc}`;
  const body = reminder
    ? `Hallo,\n\nsicher ist es im Alltag untergegangen: Die Rechnung ${i.num} vom ${fmtD(i.date)} über ${eur(total(i))} war am ${fmtD(due(i))} fällig. Ich freue mich über einen Ausgleich in den nächsten Tagen.\n\nViele Grüße\n${ME.name}`
    : `Hallo,\n\nvielen Dank für die schöne Zusammenarbeit! Anbei erhalten Sie meine Rechnung ${i.num} über ${eur(total(i))}, zahlbar bis ${fmtD(due(i))}.\n\nViele Grüße\n${ME.name}`;
  $("modal-root").innerHTML = `<div class="overlay" data-close><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-t">
    <div class="modal-h">${ic(reminder?"bell":"send")}<h2 id="m-t">${reminder?"Zahlungserinnerung senden":"Rechnung senden"}</h2><span class="small muted" style="margin-left:auto">${S.settings.sendMode==="mail"?"über Apple Mail":"per SMTP"}</span></div>
    <div class="modal-b">
      <div class="mail-field"><span>An</span><input id="m-to" value="${esc(c.mail)}"></div>
      <div class="mail-field"><span>Betreff</span><input id="m-sub" value="${esc(subj)}"></div>
      <textarea class="input" id="m-body" rows="8">${esc(body)}</textarea>
      <span class="attach"><b>PDF</b>Rechnung_${i.num}.pdf <span class="faint">· 84 KB</span></span>
    </div>
    <div class="modal-f"><button class="btn" data-close>Abbrechen</button><button class="btn primary" data-act="${reminder?"doRemind":"doSend"}" data-id="${i.id}">${ic("send")}Senden</button></div>
  </div></div>`;
  setTimeout(()=>$("m-body").focus(),30);
}
function closeModal(){$("modal-root").innerHTML=""}
let tt;
function toast(msg,icon){const t=$("toast");t.innerHTML=ic(icon||"check")+`<span>${msg}</span>`;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3600)}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const el = e.target.closest("[data-go],[data-act],[data-open],[data-filter],[data-txf],[data-open-inv],[data-close]");
  if(!el) return;
  if(el.hasAttribute("data-close") && (e.target===el || el.tagName==="BUTTON")){closeModal();return}
  if(el.dataset.go){S.view=el.dataset.go;render();$("content").scrollTop=0;return}
  if(el.dataset.open){S.selected=el.dataset.open;S.view="invoices";render();return}
  if(el.dataset.openInv){S.selected=el.dataset.openInv;S.filter="all";S.view="invoices";render();return}
  if(el.dataset.filter){S.filter=el.dataset.filter;render();return}
  if(el.dataset.txf){S.txFilter=el.dataset.txf;render();return}
  const id=el.dataset.id, a=el.dataset.act;
  const i = invoices.find(x=>x.id===id);
  switch(a){
    case "new": startDraft(); break;
    case "edit": S.draft=JSON.parse(JSON.stringify(i)); S.view="editor"; render(); break;
    case "cancel": S.view="invoices"; render(); break;
    case "addItem": S.draft.items.push({desc:"",qty:1,unit:"Std.",price:0}); render(); break;
    case "delItem": if(S.draft.items.length>1){S.draft.items.splice(+el.dataset.k,1);render()} break;
    case "save": {const n=commitDraft(); if(n){S.selected=n.id;S.view="invoices";S.filter="all";render();toast(`Gespeichert unter ~/Dokumente/Gage/Rechnungen/2026/Rechnung_${n.num}.pdf`,"save")}} break;
    case "saveSend": {const n=commitDraft(); if(n){S.selected=n.id;S.view="invoices";S.filter="all";render();openSend(n)}} break;
    case "send": openSend(i); break;
    case "remind": openSend(i,true); break;
    case "doSend": i.status="sent"; i.sentDate=iso(TODAY); closeModal(); render(); toast(`Rechnung ${i.num} an ${esc(cust(i.customerId).mail)} gesendet (Simulation)`,"send"); break;
    case "doRemind": closeModal(); toast(`Zahlungserinnerung zu ${i.num} gesendet (Simulation)`,"bell"); break;
    case "markpaid": i.paidDate=iso(TODAY); T(iso(TODAY),cust(i.customerId).name,"manuell als bezahlt markiert",total(i),{match:i.id}); render(); toast(`Rechnung ${i.num} als bezahlt markiert`); break;
    case "finder": toast(`~/Dokumente/Gage/Rechnungen/2026/Rechnung_${i.num}.pdf`,"folder"); break;
    case "match": {const t=tx.find(x=>x.id===id); const inv2=invoices.find(x=>x.id===t.suggest); t.match=inv2.id; inv2.paidDate=t.date; render(); toast(`Zahlung ${eur(t.amount)} mit Rechnung ${inv2.num} abgeglichen. Status: bezahlt.`)} break;
    case "sync": S.syncing=true; render(); setTimeout(()=>{S.syncing=false;render();toast("bunq abgerufen. Keine neuen Buchungen.","sync")},1200); break;
    case "fromGig": {const g=gigs.find(x=>x.id===id); startDraft({customerId:g.customerId,serviceDate:g.date,gigId:g.id,items:[{desc:`${g.title}, ${g.place}`,qty:1,unit:"Pauschal",price:g.fee}],note:"Zahlbar vor der Veranstaltung."})} break;
    case "export": toast(`Gewinnermittlung 2026 als ${el.dataset.what} gespeichert (Simulation)`,"pdf"); break;
    case "noop": toast("Im Mockup nicht verfügbar","info"); break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.matches("tr[data-open]")){e.target.click()}
  if(e.key==="Escape") closeModal();
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="n"){e.preventDefault();startDraft()}
});
function onEdit(e){
  const t=e.target;
  if(S.view==="editor"){
    if(t.dataset.field){S.draft[t.dataset.field]=t.value;refreshPreview();return}
    if(t.dataset.item!=null){S.draft.items[+t.dataset.item][t.dataset.key]=t.value;refreshPreview();return}
  }
}
document.addEventListener("input",onEdit);
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.gig){const g=gigs.find(x=>x.id===t.dataset.gig);g.auto=t.checked;render();toast(t.checked?`Rechnung für „${esc(g.title)}“ wird am ${fmtD(addDays(g.date,1))} erstellt`:`Automatik für „${esc(g.title)}“ ausgeschaltet`,"cal");return}
  if(t.dataset.cat){const x=tx.find(y=>y.id===t.dataset.cat);x.cat=t.value;render();toast(t.value==="Privat"?"Als privat markiert, zählt nicht zur EÜR":`Kategorie „${esc(t.value)}“ gespeichert`);return}
  if(t.dataset.set){S.settings[t.dataset.set]=t.value;renderSidebar();toast("Einstellung gespeichert");return}
  onEdit(e);
});

render();
})();
</script>
