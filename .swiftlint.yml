included:
  - App
  - Packages/GageKit/Sources
  - Packages/GageKit/Tests
excluded:
  - Packages/GageKit/.build
  - DerivedData
  - build

opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

disabled_rules:
  - todo
  - trailing_comma

line_length:
  warning: 150
  error: 200
  ignores_urls: true
  ignores_comments: true

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length: 2
  excluded: [id, x, y]

nesting:
  type_level: 2

custom_rules:
  no_print:
    name: "Kein print()"
    regex: '^\s*print\('
    message: "os.Logger mit Datenschutz-Annotation statt print() verwenden."
    severity: error
    included: '.*/Sources/.*\.swift'
